name: Debug APK

on:
  push:
    branches: [claude/debug-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleModernDebug assembleLegacyDebug --stacktrace

      - name: Publish APKs as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="debug-${{ github.run_number }}"
          gh release create "$tag" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Debug build ${{ github.run_number }}" \
            --notes "Debug APKs built from ${{ github.sha }}." \
            app/build/outputs/apk/modern/debug/*.apk \
            app/build/outputs/apk/legacy/debug/*.apk
